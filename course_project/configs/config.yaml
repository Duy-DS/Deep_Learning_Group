# ============================================================
# configs/config.yaml — Cấu hình siêu tham số dự án DL-PM25-BJ
# Tệp này là nguồn sự thật duy nhất cho mọi hyperparameter.
# KHÔNG hardcode bất kỳ giá trị nào trong mã nguồn src/.
# ============================================================

project:
  name: "DL-PM25-BJ"
  task_prefix: "BPM25"
  random_seeds: [42, 1024, 2026]

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  target_col: "pm2.5"
  wind_col: "cbwd"                # Tên cột hướng gió trong dataset UCI
  split_ratios: [0.60, 0.10, 0.10, 0.20]   # Train / Val_Dev / Val / Test
  lookback: 96                    # L = 96 giờ quan sát quá khứ
  horizons: [24, 48, 96, 192]     # H ∈ {24, 48, 96, 192} giờ dự báo
  feature_mode: "multivariate"    # "multivariate" hoặc "univariate"
  scaler_path: "data/processed/standard_scaler.pkl"

training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  optimizer: "adam"
  patience: 10                    # Early stopping patience (epochs)
  min_delta: 0.0001               # Ngưỡng cải thiện tối thiểu để tiếp tục train
  checkpoint_dir: "checkpoints"
  device: "cpu"                   # "cpu" hoặc "cuda"

models:
  lstm:
    hidden_size: 128
    num_layers: 2
    dropout: 0.2

  dlinear:
    kernel_size: 25               # Kích thước cửa sổ Moving Average (phải lẻ)

  informer:
    d_model: 512
    n_heads: 8
    e_layers: 2
    d_layers: 1
    d_ff: 2048
    factor: 5                     # ProbSparse attention factor
    dropout: 0.05

  patchtst:
    patch_len: 16
    stride: 8
    d_model: 128
    n_heads: 16
    e_layers: 3
    d_ff: 256
    dropout: 0.2

logging:
  log_dir: "outputs/logs"
  results_dir: "outputs/results"
  figures_dir: "outputs/figures"

