# ==============================================================================
# Cấu hình thực nghiệm chuẩn (Single Source of Truth) — Dự báo PM2.5 Bắc Kinh
# Khớp 100% với WP01 (data/preprocess), WP02 (train_baseline.py, src/models/*),
# WP03 (training_loop.py, fine_tune.py, run_ablation.py), WP04 (XAI) & WP05 (ONNX)
# ==============================================================================
paths:
  data_dir: "data/preprocess"          # Dùng trực tiếp thành quả đã chia tập của WP01
  output_dir: "outputs"
  global_ckpt_dir: "outputs/checkpoints/global"
  station_ckpt_dir: "outputs/checkpoints/stations"
  wp02_ckpt_dir: "outputs/checkpoints/wp02_baseline"
  wp02_log_dir: "outputs/logs/wp02_baseline"
  log_dir: "outputs/logs"
  report_dir: "outputs/reports"
  ablation_dir: "outputs/ablation"
  scaler_template: "outputs/checkpoints/global/scaler_12stations_{mode}.joblib"
  mlruns_dir: "mlruns"

xai:
  background_split: "train"
  eval_split: "test"
  background_samples: 100
  eval_samples: 200
  nsamples: 100
  seed: 42
  device: "cuda"

data:
  mode: "multivariate"                 # multivariate (D=31: 15 cơ sở + 16 wd_*) | univariate (D=1)
  num_stations: 12                      # Quy mô bộ UCI Beijing Multi-Site Air Quality của thực nghiệm
  target_col: "pm2.5"
  target_idx: 0
  lookback: 96                         # L = 96 giờ lịch sử
  horizon: 24                          # H = 24 giờ dự báo mặc định
  train_stride: 4                      # Giảm trùng lặp cửa sổ trong phạm vi 12 trạm UCI
  eval_stride: 1                       # Bước trượt tập train_dev, dev, test
  train_dev_stride: 1
  dev_stride: 1
  test_stride: 1
  train_end: "2015-12-31 23:00:00"
  train_dev_end: "2016-04-30 23:00:00"
  dev_end: "2016-08-31 23:00:00"
  num_continuous_features: 11          # 11 biến vật lý/ô nhiễm đầu tiên dùng RevIN chọn lọc
  include_wind_onehot: true            # Tự động nối thêm 16 cột wd_* từ WP01 (tổng D=31)
  canonical_multivariate_cols:
    - "pm2.5"
    - "pm10"
    - "so2"
    - "no2"
    - "co"
    - "o3"
    - "temp"
    - "pres"
    - "dewp"
    - "rain"
    - "wspm"
    - "hour_sin"
    - "hour_cos"
    - "month_sin"
    - "month_cos"
  stations:
    - "Aotizhongxin"
    - "Changping"
    - "Dingling"
    - "Dongsi"
    - "Guanyuan"
    - "Gucheng"
    - "Huairou"
    - "Nongzhanguan"
    - "Shunyi"
    - "Tiantan"
    - "Wanliu"
    - "Wanshouxigong"

wp02_baseline:
  models:
    - "lstm"
    - "dlinear"
  seeds: [42, 1024, 2026]
  batch_size: 512
  epochs: 20
  patience: 5
  lr: 1.0e-3
  optimizer: "Adam"
  scheduler: "ReduceLROnPlateau"

pretrain:
  models:
    - "lstm"
    - "dlinear"
    - "informer"
    - "patchtst"
  all_supported_models:
    - "lstm"
    - "dlinear"
    - "informer"
    - "patchtst"
    - "informer_full"
  seeds: [42, 1024, 2026]
  batch_size: 512
  epochs: 25
  patience: 5
  lr: 2.0e-4                           # LR tối ưu chống overfit sớm trên 12 trạm (đo trực tiếp trên T4)
  dlinear_lr: 1.0e-3                   # LR chuẩn cho DLinear (khớp WP02 Baseline, hội tụ đầy đủ)
  weight_decay: 3.0e-2                 # Decoupled AdamW (0.0 cho bias/norm/pos_emb; chống overfit Transformer)
  dropout: 0.30
  use_residual_anchor: false           # TẮT ResidualAnchorWrapper (gỡ nút thắt phẳng & xung đột RevIN)
  val_selection_mode: "balanced_dev"   # Chọn checkpoint cân bằng 50/50 mùa Đông (train_dev) & Hè (dev)
  loss_fn: "PeakShapeLoss"             # Peak-Weighted MSE + Temporal Slope Loss (đánh giá vẫn dùng MSE/MAE chuẩn)
  huber_delta: 2.5
  peak_threshold_z: 0.84               # ~150 ug/m3 trong không gian z-score (mean=82.2, std=80.7)
  peak_alpha: 0.15                     # Điểm ngọt trên 12 trạm: PatchTST 0.8027 MSE, SpikeMAE 82.2, PeakCap 72.0%
  diff_weight: 0.05                    # Giữ biên độ sắc nét (Range ~48%) mà không đẩy ngoại lai MSE
  peak_max_weight: 3.0                 # Chặn trên trọng số chống nhiễu ngoại lai cực đoan
  eval_metric: "MSELoss"
  optimizer: "AdamW"
  scheduler: "StepwiseWarmupCosine"
  warmup_ratio: 0.15
  min_lr_ratio: 0.01
  max_grad_norm: 1.0
  use_amp: true
  limit_train_batches: null            # null = chạy toàn bộ batch khi huấn luyện thật
  limit_val_batches: null
  include_wp02_baseline: false         # Bật true hoặc truyền --include-wp02-baseline để đối chứng WP02

finetune:
  models:
    - "lstm"
    - "dlinear"
    - "informer"
    - "patchtst"
  ckpt_source: "wp03"                  # "wp03" (Global Pretrained) | "wp02" (BaselineTrainer)
  stride: 4                            # Khớp nhịp cửa sổ train_stride=4 chống overfit từng trạm
  batch_size: 256
  epochs: 15
  patience: 5
  lr: 5.0e-5                           # LR êm cho head/adapter của trạm tránh vượt điểm tối ưu toàn cục
  backbone_lr_ratio: 0.1               # Khi unfreeze_backbone=true, backbone học chậm 10x so với head
  weight_decay: 2.0e-2
  freeze_backbone: true                # Đóng băng encoder sâu, mở khóa đúng head + adapter
  unfreeze_backbone: false
  val_selection_mode: "balanced_dev"   # Tránh overfit vào riêng tập dev mùa hè của trạm
  seed: 42
  loss_fn: "PeakShapeLoss"
  huber_delta: 2.5
  peak_threshold_z: 0.84
  peak_alpha: 0.15
  diff_weight: 0.05
  peak_max_weight: 3.0
  scheduler: "ReduceLROnPlateau"
  scheduler_factor: 0.5
  scheduler_patience: 2
  limit_train_batches: null
  limit_val_batches: null

models:
  patchtst:
    patch_len: 12
    stride: 6
    d_model: 128
    n_heads: 4
    e_layers: 3
    d_ff: 256
    dropout: 0.30
    lr: 2.0e-4
    target_idx: 0
    num_continuous_features: 11
    min_std: 0.1
    use_revin: false                   # Tắt RevIN theo chứng cứ A/B (-11.6% MSE H=24, -23.2% MSE H=192)
    use_revin_wrapper: false

  informer:
    d_model: 128
    n_heads: 4
    e_layers: 2
    d_layers: 1
    d_ff: 256
    factor: 5
    label_len: 48
    dropout: 0.25
    lr: 2.0e-4
    activation: "gelu"
    attention_type: "probsparse"
    deterministic_eval: true
    use_revin_wrapper: false           # Tắt RevIN theo chứng cứ A/B (-16.2% MSE H=24, -25.7% MSE H=192)

  informer_full:
    d_model: 128
    n_heads: 4
    e_layers: 2
    d_layers: 1
    d_ff: 256
    factor: 96
    label_len: 48
    dropout: 0.25
    lr: 2.0e-4
    activation: "gelu"
    attention_type: "full"
    deterministic_eval: true
    use_revin_wrapper: false

  lstm:
    hidden_size: 128
    num_layers: 2
    dropout: 0.30
    lr: 3.0e-4
    use_revin_wrapper: false           # Tắt RevIN theo chứng cứ A/B (-14.5% MSE H=24, giữ hồi quy H=192)

  dlinear:
    kernel_size: 25
    lr: 1.0e-3
    use_revin_wrapper: false

ablation:
  ablations: ["all"]
  all_horizons: [24, 48, 96, 192]
  ab3_horizons: [96, 192]
  skip_existing: true
  with_finetune: false
  with_wp02_baseline: false            # Bật true hoặc truyền --with-wp02-baseline để xuất bảng đối chứng WP02
