# WIKI Gender: tensor legacy NHWC, hai lớp male/female.
name: wiki_gender
input_shape_nhwc: [64, 64, 1]
input_shape_nchw: [1, 64, 64]
num_classes: 2
normalization: preserve_or_divide_by_255
legacy_rotation:
  enabled: true
  k: 3
  axes: [1, 2]
raw_dir: data/raw/wiki_gender
files:
  train_images: train_x.npy
  train_labels: train_y.npy
  validation_images: validation_x.npy
  validation_labels: validation_y.npy
download_urls:
  train_images: null
  train_labels: null
  validation_images: null
  validation_labels: null
google_drive_file_ids:
  train_images: null
  train_labels: null
  validation_images: null
  validation_labels: null