logging:
  exp_type: PyTorch
  csv_root: experiments/csv_logs
  tensorboard_root: experiments/tensorboard
checkpoint:
  path: outputs/checkpoints/05_others/fcn_detector_best.pt
  sync_to_drive: true
figure_path: outputs/figures/t0211_fcn_heatmap_detection.png